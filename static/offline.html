<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="robots" content="noindex" />
		<title>Нет соединения · Repdraft</title>
		<style>
			:root {
				color-scheme: dark;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: 24px;
				background: #0b0b0c;
				color: #f5f5f5;
				font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
			}
			main {
				max-width: 420px;
				text-align: center;
			}
			h1 {
				margin: 0 0 8px;
				font-size: 22px;
				font-weight: 800;
				letter-spacing: -0.01em;
			}
			p {
				margin: 0 0 24px;
				color: #a1a1aa;
			}
			a {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				min-height: 48px;
				padding: 0 20px;
				border-radius: 12px;
				background: #f97316;
				color: #12100e;
				font-weight: 700;
				text-decoration: none;
			}
			a:focus-visible {
				outline: 2px solid #f5f5f5;
				outline-offset: 3px;
			}
			.secondary {
				display: block;
				margin-top: 12px;
				background: transparent;
				color: #a1a1aa;
				font-weight: 600;
				min-height: 40px;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Нет соединения</h1>
			<p>Эта страница ещё не сохранена на устройстве. Тренировки и история доступны офлайн на главной.</p>
			<a href="/">Открыть главную</a>
			<a class="secondary" href="/" onclick="location.reload(); return false;">Обновить</a>
		</main>
	</body>
</html>
