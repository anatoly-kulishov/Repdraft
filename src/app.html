<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual, maximum-scale=5"
		/>
		<meta name="theme-color" content="#F2F2F7" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Repdraft" />
		<meta name="application-name" content="Repdraft" />
		<meta name="format-detection" content="telephone=no" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" href="/icon-192-v3.png" type="image/png" sizes="192x192" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-v3.png" sizes="180x180" />
		<link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed-v3.png" sizes="180x180" />
		<style>
			html,
			body {
				margin: 0;
				min-height: var(--app-vh, 100dvh);
				min-height: -webkit-fill-available;
				background-color: #f2f2f7;
			}
			html[data-theme='dark'],
			html[data-theme='dark'] body {
				background-color: #0b0b0c;
			}
			#pwa-boot {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: grid;
				place-items: center;
				background: #f2f2f7;
				pointer-events: none;
				transition: opacity 0.2s ease;
			}
			html[data-theme='dark'] #pwa-boot {
				background: #0b0b0c;
			}
			#pwa-boot .pwa-boot-icon-wrap {
				width: 120px;
				height: 120px;
				line-height: 0;
			}
			#pwa-boot .pwa-boot-icon {
				width: 120px;
				height: 120px;
				display: block;
				border-radius: 28px;
				overflow: hidden;
			}
			@media (prefers-reduced-motion: reduce) {
				#pwa-boot .pwa-boot-pulse-beam {
					display: none;
				}
			}
			#pwa-boot.is-done {
				opacity: 0;
			}
		</style>
		<script>
			(function () {
				try {
					var themeKey = 'repdraft.theme';
					var theme = localStorage.getItem(themeKey);
					if (theme !== 'light' && theme !== 'dark') {
						theme = 'light';
					}
					var bg = theme === 'light' ? '#f2f2f7' : '#0b0b0c';
					document.documentElement.setAttribute('data-theme', theme);
					if (theme === 'dark') {
						document.documentElement.classList.add('dark');
					} else {
						document.documentElement.classList.remove('dark');
					}
					document.documentElement.style.colorScheme = theme;
					document.documentElement.style.backgroundColor = bg;
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute('content', bg);
					try {
						document.cookie =
							themeKey + '=' + theme + '; path=/; Max-Age=31536000; SameSite=Lax';
					} catch (cookieThemeErr) {}
					var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
					if (bar) bar.setAttribute('content', 'black-translucent');
					var localeKey = 'repdraft.locale';
					var storedLocale = localStorage.getItem(localeKey);
					if (storedLocale === 'en' || storedLocale === 'ru') {
						document.documentElement.lang = storedLocale;
						document.documentElement.dataset.locale = storedLocale;
						try {
							document.cookie =
								localeKey + '=' + storedLocale + '; path=/; Max-Age=31536000; SameSite=Lax';
						} catch (localeCookieErr) {}
					}
					/* Auth /auth boot: pick account vs guest skeleton before Svelte hydrates. */
					var authBoot = 'guest';
					var cacheUser = localStorage.getItem('repdraft:local-cache-user');
					if (cacheUser && cacheUser.trim()) {
						authBoot = 'account';
					} else {
						for (var i = 0; i < localStorage.length; i++) {
							var k = localStorage.key(i);
							if (!k || k.indexOf('sb-') !== 0 || k.slice(-11) !== '-auth-token') continue;
							var raw = localStorage.getItem(k);
							if (!raw) continue;
							try {
								var parsed = JSON.parse(raw);
								var uid =
									(parsed && parsed.user && parsed.user.id) ||
									(parsed &&
										parsed.currentSession &&
										parsed.currentSession.user &&
										parsed.currentSession.user.id);
								if (uid) {
									authBoot = 'account';
									break;
								}
							} catch (err) {}
						}
					}
					document.documentElement.dataset.authBoot = authBoot;
					try {
						if (authBoot === 'account') {
							document.cookie =
								'repdraft_auth_boot=1; path=/; Max-Age=31536000; SameSite=Lax';
						} else {
							document.cookie = 'repdraft_auth_boot=; path=/; Max-Age=0; SameSite=Lax';
						}
					} catch (cookieErr) {}
					/* Home boot: start skeleton when local plans exist (or signed-in). */
					var homeBoot = authBoot === 'account' ? 'start' : 'create';
					var workoutsPlanRows = 0;
					try {
						var plansRaw = localStorage.getItem('repdraft:plans');
						if (plansRaw) {
							var plansParsed = JSON.parse(plansRaw);
							if (Array.isArray(plansParsed)) {
								workoutsPlanRows = plansParsed.length;
								if (plansParsed.length > 0) homeBoot = 'start';
							}
						}
					} catch (plansErr) {}
					/* Match WORKOUTS_PLANS_SKELETON_ROW_LIMIT in domain/home.ts */
					var workoutsPlanRowsCapped = Math.min(Math.max(workoutsPlanRows, 0), 6);
					document.documentElement.dataset.workoutsPlanRows = String(
						workoutsPlanRowsCapped
					);
					try {
						document.cookie =
							'repdraft_workouts_plan_rows=' +
							workoutsPlanRowsCapped +
							'; path=/; Max-Age=31536000; SameSite=Lax';
					} catch (workoutsRowsCookieErr) {}
					document.documentElement.dataset.homeBoot = homeBoot;
					try {
						document.cookie =
							'repdraft_home_boot=' +
							homeBoot +
							'; path=/; Max-Age=31536000; SameSite=Lax';
					} catch (homeBootCookieErr) {}
					var homeShowChecklist = true;
					try {
						var onboardingRaw = localStorage.getItem('repdraft:onboarding');
						if (onboardingRaw) {
							var onboardingParsed = JSON.parse(onboardingRaw);
							if (
								onboardingParsed &&
								(onboardingParsed.checklistDismissed === true ||
									onboardingParsed.activatedAt ||
									(onboardingParsed.checklist &&
										onboardingParsed.checklist.sessionFinished === true))
							) {
								homeShowChecklist = false;
							}
						}
					} catch (onboardingErr) {}
					if (homeBoot === 'start') homeShowChecklist = false;
					document.documentElement.dataset.homeShowChecklist = homeShowChecklist
						? '1'
						: '0';
					try {
						if (homeShowChecklist) {
							document.cookie =
								'repdraft_onboarding_checklist=1; path=/; Max-Age=31536000; SameSite=Lax';
						} else {
							document.cookie =
								'repdraft_onboarding_checklist=; path=/; Max-Age=0; SameSite=Lax';
						}
					} catch (onboardingCookieErr) {}
					var homeRecentRows = 0;
					try {
						var sessionsRaw = localStorage.getItem('repdraft:sessions');
						if (sessionsRaw) {
							var sessionsParsed = JSON.parse(sessionsRaw);
							if (Array.isArray(sessionsParsed)) {
								homeRecentRows = sessionsParsed.filter(function (s) {
									return s && s.finishedAt;
								}).length;
							}
						}
					} catch (sessionsErr) {}
					document.documentElement.dataset.homeRecentRows = homeRecentRows > 0 ? '3' : '0';
					/* Match WORKOUTS_HISTORY_SKELETON_ROW_LIMIT in domain/home.ts */
					var workoutsHistoryRowsCapped = Math.min(Math.max(homeRecentRows, 0), 8);
					document.documentElement.dataset.workoutsHistoryRows = String(
						workoutsHistoryRowsCapped
					);
					try {
						if (homeRecentRows > 0) {
							document.cookie =
								'repdraft_home_has_history=1; path=/; Max-Age=31536000; SameSite=Lax';
							document.cookie =
								'repdraft_workouts_history_rows=' +
								workoutsHistoryRowsCapped +
								'; path=/; Max-Age=31536000; SameSite=Lax';
						} else {
							document.cookie = 'repdraft_home_has_history=; path=/; Max-Age=0; SameSite=Lax';
							document.cookie = 'repdraft_workouts_history_rows=0; path=/; Max-Age=31536000; SameSite=Lax';
						}
					} catch (historyCookieErr) {}
					try {
						var activeRaw = localStorage.getItem('repdraft:active-session');
						if (activeRaw) {
							var activeParsed = JSON.parse(activeRaw);
							if (activeParsed && !activeParsed.finishedAt) {
								document.documentElement.dataset.homeActiveSession = '1';
								document.cookie =
									'repdraft_home_active=1; path=/; Max-Age=31536000; SameSite=Lax';
							} else {
								delete document.documentElement.dataset.homeActiveSession;
								document.cookie = 'repdraft_home_active=; path=/; Max-Age=0; SameSite=Lax';
							}
						} else {
							delete document.documentElement.dataset.homeActiveSession;
						}
					} catch (activeErr) {}
					try {
						if (workoutsPlanRows > 0) {
							document.cookie =
								'repdraft_home_has_plans=1; path=/; Max-Age=31536000; SameSite=Lax';
						} else {
							document.cookie = 'repdraft_home_has_plans=; path=/; Max-Age=0; SameSite=Lax';
						}
					} catch (homeCookieErr) {}
					var builderDraftRows = 0;
					try {
						var draftRaw = localStorage.getItem('repdraft:draft');
						if (draftRaw) {
							var draftParsed = JSON.parse(draftRaw);
							if (draftParsed && Array.isArray(draftParsed.exercises)) {
								builderDraftRows = draftParsed.exercises.length;
							}
						}
					} catch (builderDraftErr) {}
					var builderDraftRowsCapped = Math.min(Math.max(builderDraftRows, 0), 4);
					document.documentElement.dataset.builderDraftRows = String(builderDraftRowsCapped);
					try {
						document.cookie =
							'repdraft_builder_draft_rows=' +
							builderDraftRows +
							'; path=/; Max-Age=31536000; SameSite=Lax';
					} catch (builderDraftCookieErr) {}
					var bookmarksCount = 0;
					try {
						var bookmarksRaw = localStorage.getItem('repdraft:bookmarks');
						if (bookmarksRaw) {
							var bookmarksParsed = JSON.parse(bookmarksRaw);
							if (Array.isArray(bookmarksParsed)) {
								bookmarksCount = bookmarksParsed.filter(function (id) {
									return typeof id === 'string' && id.length > 0;
								}).length;
							}
						}
					} catch (bookmarksErr) {}
					try {
						document.cookie =
							'repdraft_bookmarks_count=' +
							bookmarksCount +
							'; path=/; Max-Age=31536000; SameSite=Lax';
					} catch (bookmarksCookieErr) {}
					var recordsCount = 0;
					try {
						var recordsRaw = localStorage.getItem('repdraft:records');
						if (recordsRaw) {
							var recordsParsed = JSON.parse(recordsRaw);
							if (Array.isArray(recordsParsed)) {
								recordsCount = recordsParsed.filter(function (r) {
									if (!r) return false;
									var hasWeight = r.weightKg != null && !isNaN(r.weightKg);
									var hasReps = r.reps != null && !isNaN(r.reps);
									return hasWeight || hasReps;
								}).length;
							}
						}
					} catch (recordsErr) {}
					try {
						document.cookie =
							'repdraft_records_count=' +
							recordsCount +
							'; path=/; Max-Age=31536000; SameSite=Lax';
					} catch (recordsCookieErr) {}
				} catch (e) {}
			})();
			// Capture beforeinstallprompt early — it can fire before Svelte mounts.
			(function () {
				window.__repdraftBip = null;
				window.addEventListener('beforeinstallprompt', function (e) {
					e.preventDefault();
					window.__repdraftBip = e;
					window.dispatchEvent(new CustomEvent('repdraft:bip'));
				});
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<script>
			(function () {
				var KEYBOARD_LIFT_PX = 100;
				var focusoutSyncTimers = [];
				function isEditableTarget(el) {
					if (!el || el === document.body || el === document.documentElement) return false;
					var tag = el.tagName;
					if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return true;
					if (el.isContentEditable) return true;
					return false;
				}
				function clearFocusoutSyncTimers() {
					for (var i = 0; i < focusoutSyncTimers.length; i++) {
						window.clearTimeout(focusoutSyncTimers[i]);
					}
					focusoutSyncTimers = [];
				}
				function syncVvChrome() {
					var vv = window.visualViewport;
					var root = document.documentElement;
					var layoutH = window.innerHeight;
					if (!vv) {
						root.style.setProperty('--vv-fixed-bottom', '0px');
						root.style.setProperty('--vv-keyboard-lift', '0px');
						root.style.setProperty('--vv-keyboard-inset', '0px');
						root.style.setProperty('--app-vh', layoutH + 'px');
						root.style.removeProperty('--vv-bottom-pad');
						return;
					}
					var visualBottom = Math.round(vv.height + vv.offsetTop);
					root.style.setProperty('--app-vh', Math.max(layoutH, visualBottom) + 'px');
					var bottomInset = Math.max(0, Math.round(layoutH - visualBottom));
					/* Residual inset after keyboard dismiss must not lift sticky CTA. */
					if (!isEditableTarget(document.activeElement) && bottomInset <= KEYBOARD_LIFT_PX) {
						bottomInset = 0;
					}
					root.style.setProperty('--vv-fixed-bottom', bottomInset + 'px');
					var keyboardInset = bottomInset > KEYBOARD_LIFT_PX ? bottomInset : 0;
					root.style.setProperty('--vv-keyboard-inset', keyboardInset + 'px');
					root.style.setProperty('--vv-keyboard-lift', keyboardInset + 'px');
					if (keyboardInset > 0) root.style.setProperty('--vv-bottom-pad', '0px');
					else root.style.removeProperty('--vv-bottom-pad');
				}
				function scheduleFocusoutSync() {
					clearFocusoutSyncTimers();
					syncVvChrome();
					focusoutSyncTimers.push(window.setTimeout(syncVvChrome, 50));
					focusoutSyncTimers.push(window.setTimeout(syncVvChrome, 200));
					focusoutSyncTimers.push(window.setTimeout(syncVvChrome, 400));
				}
				syncVvChrome();
				if (window.visualViewport) {
					window.visualViewport.addEventListener('resize', syncVvChrome);
					window.visualViewport.addEventListener('scroll', syncVvChrome);
				}
				window.addEventListener('orientationchange', syncVvChrome);
				window.addEventListener('pageshow', syncVvChrome);
				document.addEventListener(
					'focusin',
					function () {
						clearFocusoutSyncTimers();
						syncVvChrome();
					},
					true
				);
				document.addEventListener(
					'focusout',
					function () {
						scheduleFocusoutSync();
					},
					true
				);
				window.__repdraftSyncVvChrome = syncVvChrome;
			})();
		</script>
		<div id="pwa-boot" aria-hidden="true">
			<div class="pwa-boot-icon-wrap">
				<svg
					class="pwa-boot-icon"
					viewBox="0 0 512 512"
					width="120"
					height="120"
					aria-hidden="true"
					focusable="false"
				>
					<defs>
						<linearGradient
							id="repdraft-boot-g"
							gradientUnits="userSpaceOnUse"
							x1="0"
							y1="0"
							x2="512"
							y2="512"
						>
							<stop offset="0%" stop-color="#8b5cf6" />
							<stop offset="62%" stop-color="#a78bfa" />
							<stop offset="100%" stop-color="#c4b5fd" />
						</linearGradient>
						<radialGradient id="repdraft-boot-beam" cx="50%" cy="50%" r="50%">
							<stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
							<stop offset="45%" stop-color="#ede9fe" stop-opacity="0.55" />
							<stop offset="100%" stop-color="#c4b5fd" stop-opacity="0" />
						</radialGradient>
					</defs>
					<rect width="512" height="512" rx="114" fill="url(#repdraft-boot-g)" />
					<ellipse
						class="pwa-boot-pulse-beam"
						cx="60"
						cy="256"
						rx="72"
						ry="52"
						fill="url(#repdraft-boot-beam)"
						opacity="0"
					>
						<animate
							attributeName="cx"
							values="60;420;460"
							keyTimes="0;0.5;1"
							calcMode="spline"
							keySplines="0.4 0 0.2 1; 0.4 0 1 1"
							dur="1.7s"
							repeatCount="indefinite"
						/>
						<animate
							attributeName="opacity"
							values="0;0.95;0.75;0;0"
							keyTimes="0;0.1;0.48;0.58;1"
							dur="1.7s"
							repeatCount="indefinite"
						/>
					</ellipse>
					<image
						href="/brand-mark-pulse.png"
						x="0"
						y="0"
						width="512"
						height="512"
						preserveAspectRatio="xMidYMid meet"
					/>
				</svg>
			</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			(function () {
				var boot = document.getElementById('pwa-boot');
				if (!boot) return;
				var done = false;
				var shownAt = typeof performance !== 'undefined' ? performance.now() : Date.now();
				/* Antiflash while HTML parses + Svelte mounts. Not tied to XHR/data.
				 * Hide = max(ready, MIN): ready = DOM/load/hydrate; MIN keeps one beam pass visible.
				 * MAX is an escape hatch if fonts/preload hang. */
				var MIN_MS = 1100;
				var MAX_MS = 2500;
				var hide = function () {
					if (done) return;
					done = true;
					var now = typeof performance !== 'undefined' ? performance.now() : Date.now();
					var wait = Math.max(0, MIN_MS - (now - shownAt));
					window.setTimeout(function () {
						boot.classList.add('is-done');
						window.setTimeout(function () {
							if (boot && boot.parentNode) boot.remove();
							if (typeof window.__repdraftSyncVvChrome === 'function') {
								window.__repdraftSyncVvChrome();
								window.setTimeout(window.__repdraftSyncVvChrome, 50);
								window.setTimeout(window.__repdraftSyncVvChrome, 200);
							}
						}, 220);
					}, wait);
				};
				window.__repdraftHideBoot = hide;
				/* Prefer quieter splash when user asks for reduced motion. */
				try {
					if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
						var anims = boot.querySelectorAll('animate');
						for (var i = 0; i < anims.length; i++) anims[i].remove();
						MIN_MS = 160;
						MAX_MS = 700;
					}
				} catch (rmErr) {}
				/* Do not wait only on window.load — font/preload hangs left splash forever. */
				if (document.readyState === 'interactive' || document.readyState === 'complete') {
					hide();
				} else {
					document.addEventListener('DOMContentLoaded', hide, { once: true });
				}
				window.addEventListener('load', hide, { once: true });
				window.setTimeout(hide, MAX_MS);
			})();
		</script>
	</body>
</html>
