<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content, maximum-scale=5"
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<meta name="theme-color" content="#F7F5FC" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Repdraft" />
		<meta name="application-name" content="Repdraft" />
		<meta name="format-detection" content="telephone=no" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-v2.png" sizes="180x180" />
		<link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed-v2.png" sizes="180x180" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" href="/icon-192-v2.png" type="image/png" sizes="192x192" />
		<style>
			html,
			body {
				margin: 0;
				min-height: 100%;
				background-color: #f7f5fc;
			}
			html[data-theme='dark'],
			html[data-theme='dark'] body {
				background-color: #0a0a0d;
			}
			#pwa-boot {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: grid;
				place-items: center;
				background: #f7f5fc;
				pointer-events: none;
				transition: opacity 0.2s ease;
			}
			html[data-theme='dark'] #pwa-boot {
				background: #0a0a0d;
			}
			#pwa-boot .pwa-boot-icon-wrap {
				width: 96px;
				height: 96px;
				line-height: 0;
			}
			#pwa-boot .pwa-boot-icon {
				width: 96px;
				height: 96px;
				display: block;
			}
			#pwa-boot.is-done {
				opacity: 0;
			}
		</style>
		<script>
			(function () {
				try {
					var themeKey = 'repdraft.theme';
					var theme = localStorage.getItem(themeKey);
					if (theme !== 'light' && theme !== 'dark') {
						theme = 'light';
					}
					var bg = theme === 'light' ? '#f7f5fc' : '#0a0a0d';
					document.documentElement.setAttribute('data-theme', theme);
					document.documentElement.style.colorScheme = theme;
					document.documentElement.style.backgroundColor = bg;
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute('content', bg);
					var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
					if (bar) bar.setAttribute('content', 'black-translucent');
					var localeKey = 'repdraft.locale';
					var storedLocale = localStorage.getItem(localeKey);
					if (storedLocale === 'en' || storedLocale === 'ru') {
						document.documentElement.lang = storedLocale;
						document.documentElement.dataset.locale = storedLocale;
					}
				} catch (e) {}
			})();
			// Capture beforeinstallprompt early — it can fire before Svelte mounts.
			(function () {
				window.__repdraftBip = null;
				window.addEventListener('beforeinstallprompt', function (e) {
					e.preventDefault();
					window.__repdraftBip = e;
					window.dispatchEvent(new CustomEvent('repdraft:bip'));
				});
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="pwa-boot" aria-hidden="true">
			<div class="pwa-boot-icon-wrap">
				<svg
					class="pwa-boot-icon"
					viewBox="0 0 512 512"
					width="96"
					height="96"
					aria-hidden="true"
					focusable="false"
				>
					<defs>
						<linearGradient id="repdraft-boot-g" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
							<stop offset="0" stop-color="#8B5CF6" />
							<stop offset="1" stop-color="#6366F1" />
						</linearGradient>
					</defs>
					<rect width="512" height="512" rx="114" ry="114" fill="url(#repdraft-boot-g)" />
					<path
						d="M148 112V392M148 112H286C347 112 380 148 380 198C380 248 347 280 286 280H148M218 280L350 408"
						fill="none"
						stroke="#FFFFFF"
						stroke-width="34"
						stroke-linecap="round"
						stroke-linejoin="round"
					/>
				</svg>
			</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			(function () {
				var boot = document.getElementById('pwa-boot');
				if (!boot) return;
				var hide = function () {
					boot.classList.add('is-done');
					window.setTimeout(function () {
						boot.remove();
					}, 220);
				};
				if (document.readyState === 'complete') hide();
				else window.addEventListener('load', hide, { once: true });
			})();
		</script>
	</body>
</html>
