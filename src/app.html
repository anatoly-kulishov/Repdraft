<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
		/>
		<meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0f766e" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Repdraft" />
		<meta name="application-name" content="Repdraft" />
		<meta name="format-detection" content="telephone=no" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icon.svg" />
		<!-- Apply saved locale before first paint to avoid RU→EN text flash. -->
		<script>
			(function () {
				try {
					var key = 'repdraft.locale';
					var stored = localStorage.getItem(key);
					if (stored === 'en' || stored === 'ru') {
						document.documentElement.lang = stored;
						document.documentElement.dataset.locale = stored;
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
