<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual, maximum-scale=5"
		/>
		<meta name="theme-color" content="#F2F2F7" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Repdraft" />
		<meta name="application-name" content="Repdraft" />
		<meta name="format-detection" content="telephone=no" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-v2.png" sizes="180x180" />
		<link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed-v2.png" sizes="180x180" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" href="/icon-192-v2.png" type="image/png" sizes="192x192" />
		<style>
			html,
			body {
				margin: 0;
				min-height: var(--app-vh, 100dvh);
				min-height: -webkit-fill-available;
				background-color: #f2f2f7;
			}
			html[data-theme='dark'],
			html[data-theme='dark'] body {
				background-color: #0b0b0c;
			}
			#pwa-boot {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: grid;
				place-items: center;
				background: #f2f2f7;
				pointer-events: none;
				transition: opacity 0.2s ease;
			}
			html[data-theme='dark'] #pwa-boot {
				background: #0b0b0c;
			}
			#pwa-boot .pwa-boot-icon-wrap {
				width: 96px;
				height: 96px;
				line-height: 0;
			}
			#pwa-boot .pwa-boot-icon {
				width: 96px;
				height: 96px;
				display: block;
				border-radius: 22px;
				overflow: hidden;
				animation: pwa-boot-breathe 2.4s ease-in-out infinite;
			}
			@keyframes pwa-boot-breathe {
				0%,
				100% {
					transform: scale(1);
					filter: saturate(1);
				}
				50% {
					transform: scale(1.035);
					filter: saturate(1.12);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#pwa-boot .pwa-boot-icon {
					animation: none;
				}
			}
			#pwa-boot.is-done {
				opacity: 0;
			}
		</style>
		<script>
			(function () {
				try {
					var themeKey = 'repdraft.theme';
					var theme = localStorage.getItem(themeKey);
					if (theme !== 'light' && theme !== 'dark') {
						theme = 'light';
					}
					var bg = theme === 'light' ? '#f2f2f7' : '#0b0b0c';
					document.documentElement.setAttribute('data-theme', theme);
					if (theme === 'dark') {
						document.documentElement.classList.add('dark');
					} else {
						document.documentElement.classList.remove('dark');
					}
					document.documentElement.style.colorScheme = theme;
					document.documentElement.style.backgroundColor = bg;
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute('content', bg);
					try {
						document.cookie =
							themeKey + '=' + theme + '; path=/; Max-Age=31536000; SameSite=Lax';
					} catch (cookieThemeErr) {}
					var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
					if (bar) bar.setAttribute('content', 'black-translucent');
					var localeKey = 'repdraft.locale';
					var storedLocale = localStorage.getItem(localeKey);
					if (storedLocale === 'en' || storedLocale === 'ru') {
						document.documentElement.lang = storedLocale;
						document.documentElement.dataset.locale = storedLocale;
					}
					/* Auth /auth boot: pick account vs guest skeleton before Svelte hydrates. */
					var authBoot = 'guest';
					var cacheUser = localStorage.getItem('repdraft:local-cache-user');
					if (cacheUser && cacheUser.trim()) {
						authBoot = 'account';
					} else {
						for (var i = 0; i < localStorage.length; i++) {
							var k = localStorage.key(i);
							if (!k || k.indexOf('sb-') !== 0 || k.slice(-11) !== '-auth-token') continue;
							var raw = localStorage.getItem(k);
							if (!raw) continue;
							try {
								var parsed = JSON.parse(raw);
								var uid =
									(parsed && parsed.user && parsed.user.id) ||
									(parsed &&
										parsed.currentSession &&
										parsed.currentSession.user &&
										parsed.currentSession.user.id);
								if (uid) {
									authBoot = 'account';
									break;
								}
							} catch (err) {}
						}
					}
					document.documentElement.dataset.authBoot = authBoot;
					try {
						if (authBoot === 'account') {
							document.cookie =
								'repdraft_auth_boot=1; path=/; Max-Age=31536000; SameSite=Lax';
						} else {
							document.cookie = 'repdraft_auth_boot=; path=/; Max-Age=0; SameSite=Lax';
						}
					} catch (cookieErr) {}
					/* Home boot: start skeleton when local plans exist (or signed-in). */
					var homeBoot = authBoot === 'account' ? 'start' : 'create';
					var workoutsPlanRows = 0;
					try {
						var plansRaw = localStorage.getItem('repdraft:plans');
						if (plansRaw) {
							var plansParsed = JSON.parse(plansRaw);
							if (Array.isArray(plansParsed)) {
								workoutsPlanRows = plansParsed.length;
								if (plansParsed.length > 0) homeBoot = 'start';
							}
						}
					} catch (plansErr) {}
					document.documentElement.dataset.workoutsPlanRows = String(
						Math.min(Math.max(workoutsPlanRows, 0), 4)
					);
					try {
						document.cookie =
							'repdraft_workouts_plan_rows=' +
							Math.min(Math.max(workoutsPlanRows, 0), 4) +
							'; path=/; Max-Age=31536000; SameSite=Lax';
					} catch (workoutsRowsCookieErr) {}
					document.documentElement.dataset.homeBoot = homeBoot;
					try {
						document.cookie =
							'repdraft_home_boot=' +
							homeBoot +
							'; path=/; Max-Age=31536000; SameSite=Lax';
					} catch (homeBootCookieErr) {}
					var homeShowChecklist = true;
					try {
						var onboardingRaw = localStorage.getItem('repdraft:onboarding');
						if (onboardingRaw) {
							var onboardingParsed = JSON.parse(onboardingRaw);
							if (
								onboardingParsed &&
								(onboardingParsed.checklistDismissed === true ||
									onboardingParsed.activatedAt ||
									(onboardingParsed.checklist &&
										onboardingParsed.checklist.sessionFinished === true))
							) {
								homeShowChecklist = false;
							}
						}
					} catch (onboardingErr) {}
					document.documentElement.dataset.homeShowChecklist = homeShowChecklist
						? '1'
						: '0';
					try {
						if (homeShowChecklist) {
							document.cookie =
								'repdraft_onboarding_checklist=1; path=/; Max-Age=31536000; SameSite=Lax';
						} else {
							document.cookie =
								'repdraft_onboarding_checklist=; path=/; Max-Age=0; SameSite=Lax';
						}
					} catch (onboardingCookieErr) {}
					var homeRecentRows = 0;
					try {
						var sessionsRaw = localStorage.getItem('repdraft:sessions');
						if (sessionsRaw) {
							var sessionsParsed = JSON.parse(sessionsRaw);
							if (Array.isArray(sessionsParsed)) {
								homeRecentRows = sessionsParsed.filter(function (s) {
									return s && s.finishedAt;
								}).length;
							}
						}
					} catch (sessionsErr) {}
					document.documentElement.dataset.homeRecentRows = homeRecentRows > 0 ? '3' : '0';
					document.documentElement.dataset.workoutsHistoryRows = String(
						Math.min(Math.max(homeRecentRows, 0), 4)
					);
					try {
						if (homeRecentRows > 0) {
							document.cookie =
								'repdraft_home_has_history=1; path=/; Max-Age=31536000; SameSite=Lax';
							document.cookie =
								'repdraft_workouts_history_rows=' +
								Math.min(Math.max(homeRecentRows, 0), 4) +
								'; path=/; Max-Age=31536000; SameSite=Lax';
						} else {
							document.cookie = 'repdraft_home_has_history=; path=/; Max-Age=0; SameSite=Lax';
							document.cookie = 'repdraft_workouts_history_rows=0; path=/; Max-Age=31536000; SameSite=Lax';
						}
					} catch (historyCookieErr) {}
					try {
						var activeRaw = localStorage.getItem('repdraft:active-session');
						if (activeRaw) {
							var activeParsed = JSON.parse(activeRaw);
							if (activeParsed && !activeParsed.finishedAt) {
								document.documentElement.dataset.homeActiveSession = '1';
								document.cookie =
									'repdraft_home_active=1; path=/; Max-Age=31536000; SameSite=Lax';
							} else {
								delete document.documentElement.dataset.homeActiveSession;
								document.cookie = 'repdraft_home_active=; path=/; Max-Age=0; SameSite=Lax';
							}
						} else {
							delete document.documentElement.dataset.homeActiveSession;
						}
					} catch (activeErr) {}
					try {
						if (homeBoot === 'start') {
							document.cookie =
								'repdraft_home_has_plans=1; path=/; Max-Age=31536000; SameSite=Lax';
						} else {
							document.cookie = 'repdraft_home_has_plans=; path=/; Max-Age=0; SameSite=Lax';
						}
					} catch (homeCookieErr) {}
				} catch (e) {}
			})();
			// Capture beforeinstallprompt early — it can fire before Svelte mounts.
			(function () {
				window.__repdraftBip = null;
				window.addEventListener('beforeinstallprompt', function (e) {
					e.preventDefault();
					window.__repdraftBip = e;
					window.dispatchEvent(new CustomEvent('repdraft:bip'));
				});
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<script>
			(function () {
				var KEYBOARD_LIFT_PX = 100;
				function syncVvChrome() {
					var vv = window.visualViewport;
					var root = document.documentElement;
					var layoutH = window.innerHeight;
					if (!vv) {
						root.style.setProperty('--vv-fixed-bottom', '0px');
						root.style.setProperty('--vv-keyboard-lift', '0px');
						root.style.setProperty('--vv-keyboard-inset', '0px');
						root.style.setProperty('--app-vh', layoutH + 'px');
						root.style.removeProperty('--vv-bottom-pad');
						return;
					}
					var visualBottom = Math.round(vv.height + vv.offsetTop);
					root.style.setProperty('--app-vh', Math.max(layoutH, visualBottom) + 'px');
					var bottomInset = Math.max(0, Math.round(layoutH - visualBottom));
					root.style.setProperty('--vv-fixed-bottom', bottomInset + 'px');
					var keyboardInset = bottomInset > KEYBOARD_LIFT_PX ? bottomInset : 0;
					root.style.setProperty('--vv-keyboard-inset', keyboardInset + 'px');
					root.style.setProperty('--vv-keyboard-lift', keyboardInset + 'px');
					if (keyboardInset > 0) root.style.setProperty('--vv-bottom-pad', '0px');
					else root.style.removeProperty('--vv-bottom-pad');
				}
				syncVvChrome();
				if (window.visualViewport) {
					window.visualViewport.addEventListener('resize', syncVvChrome);
					window.visualViewport.addEventListener('scroll', syncVvChrome);
				}
				window.addEventListener('orientationchange', syncVvChrome);
				window.addEventListener('pageshow', syncVvChrome);
				window.__repdraftSyncVvChrome = syncVvChrome;
			})();
		</script>

				</svg>
			</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			(function () {
				var boot = document.getElementById('pwa-boot');
				if (!boot) return;
				var done = false;
				var shownAt = typeof performance !== 'undefined' ? performance.now() : Date.now();
				/* Keep logo splash readable; still escape font/preload hangs via MAX. */
				/* Long enough to catch a beat of the violet shimmer; escape hangs via MAX. */
				var MIN_MS = 280;
				var MAX_MS = 900;
				var hide = function () {
					if (done) return;
					done = true;
					var now = typeof performance !== 'undefined' ? performance.now() : Date.now();
					var wait = Math.max(0, MIN_MS - (now - shownAt));
					window.setTimeout(function () {
						boot.classList.add('is-done');
						window.setTimeout(function () {
							if (boot && boot.parentNode) boot.remove();
							if (typeof window.__repdraftSyncVvChrome === 'function') {
								window.__repdraftSyncVvChrome();
								window.setTimeout(window.__repdraftSyncVvChrome, 50);
								window.setTimeout(window.__repdraftSyncVvChrome, 200);
							}
						}, 220);
					}, wait);
				};
				window.__repdraftHideBoot = hide;
				/* Prefer quieter splash when user asks for reduced motion. */
				try {
					if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
						var anims = boot.querySelectorAll('animate');
						for (var i = 0; i < anims.length; i++) anims[i].remove();
						MIN_MS = 160;
						MAX_MS = 700;
					}
				} catch (rmErr) {}
				/* Do not wait only on window.load — font/preload hangs left splash forever. */
				if (document.readyState === 'interactive' || document.readyState === 'complete') {
					hide();
				} else {
					document.addEventListener('DOMContentLoaded', hide, { once: true });
				}
				window.addEventListener('load', hide, { once: true });
				window.setTimeout(hide, MAX_MS);
			})();
		</script>
	</body>
</html>
