<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content, maximum-scale=5"
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<meta name="theme-color" content="#E8ECF0" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Repdraft" />
		<meta name="application-name" content="Repdraft" />
		<meta name="format-detection" content="telephone=no" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<!--
			iOS home screen: single opaque PNG, no media=.
			Safari ignores SVG and often skips apple-touch-icon when media variants are present,
			then falls back to a lettermark using theme-color (purple square + white R).
		-->
		<link rel="apple-touch-icon" href="/apple-touch-icon-v2.png" sizes="180x180" />
		<link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed-v2.png" sizes="180x180" />
		<link
			rel="icon"
			href="/icon.svg"
			type="image/svg+xml"
			media="(prefers-color-scheme: dark)"
		/>
		<link
			rel="icon"
			href="/icon-light.svg"
			type="image/svg+xml"
			media="(prefers-color-scheme: light)"
		/>
		<link rel="icon" href="/icon-adaptive.svg" type="image/svg+xml" />
		<style>
			html,
			body {
				margin: 0;
				min-height: 100%;
				background-color: #e8ecf0;
			}
			html[data-theme='dark'],
			html[data-theme='dark'] body {
				background-color: #0b0b0c;
			}
			#pwa-boot {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: grid;
				place-items: center;
				background: #e8ecf0;
				pointer-events: none;
				transition: opacity 0.2s ease;
			}
			html[data-theme='dark'] #pwa-boot {
				background: #0b0b0c;
			}
			#pwa-boot img {
				width: 96px;
				height: 96px;
				/* Corners live in the SVG (rx) — extra CSS radius double-clips and looks uneven. */
				display: block;
			}
			#pwa-boot .pwa-boot-icon--dark {
				display: none;
			}
			html[data-theme='dark'] #pwa-boot .pwa-boot-icon--light {
				display: none;
			}
			html[data-theme='dark'] #pwa-boot .pwa-boot-icon--dark {
				display: block;
			}
			#pwa-boot.is-done {
				opacity: 0;
			}
		</style>
		<script>
			(function () {
				try {
					var themeKey = 'repdraft.theme';
					var theme = localStorage.getItem(themeKey);
					if (theme !== 'light' && theme !== 'dark') {
						theme = 'light';
					}
					var bg = theme === 'light' ? '#e8ecf0' : '#0b0b0c';
					document.documentElement.setAttribute('data-theme', theme);
					document.documentElement.style.colorScheme = theme;
					document.documentElement.style.backgroundColor = bg;
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute('content', bg);
					var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
					if (bar) bar.setAttribute('content', 'black-translucent');
					var localeKey = 'repdraft.locale';
					var storedLocale = localStorage.getItem(localeKey);
					if (storedLocale === 'en' || storedLocale === 'ru') {
						document.documentElement.lang = storedLocale;
						document.documentElement.dataset.locale = storedLocale;
					}
				} catch (e) {}
			})();
			// Capture beforeinstallprompt early — it can fire before Svelte mounts.
			(function () {
				window.__repdraftBip = null;
				window.addEventListener('beforeinstallprompt', function (e) {
					e.preventDefault();
					window.__repdraftBip = e;
					window.dispatchEvent(new CustomEvent('repdraft:bip'));
				});
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="pwa-boot" aria-hidden="true">
			<img
				class="pwa-boot-icon pwa-boot-icon--dark"
				src="/icon.svg"
				alt=""
				width="96"
				height="96"
			/>
			<img
				class="pwa-boot-icon pwa-boot-icon--light"
				src="/icon-light.svg"
				alt=""
				width="96"
				height="96"
			/>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			(function () {
				var boot = document.getElementById('pwa-boot');
				if (!boot) return;
				var hide = function () {
					boot.classList.add('is-done');
					window.setTimeout(function () {
						boot.remove();
					}, 220);
				};
				if (document.readyState === 'complete') hide();
				else window.addEventListener('load', hide, { once: true });
			})();
		</script>
	</body>
</html>
