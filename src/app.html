		<style>
			html,
			body {
				margin: 0;
				min-height: var(--app-vh, 100dvh);
				min-height: -webkit-fill-available;
				background-color: #f2f2f7;
			}
			html[data-theme='dark'],
			html[data-theme='dark'] body {
				background-color: #0b0b0c;
			}
			#pwa-boot {
				position: fixed;
				top: 0;
				left: 0;
				z-index: 2147483646;
				/* Sized to screen via JS — covers short first viewport (812 vs 874). */
				width: 100%;
				height: 100%;
				background: #f2f2f7;
				pointer-events: auto;
				opacity: 1;
				transform: translateZ(0);
				will-change: opacity;
				/* Keep in sync with FADE_MS + .app-shell boot-enter in shell.css */
				transition: opacity 0.44s cubic-bezier(0.22, 1, 0.36, 1);
			}
			html[data-theme='dark'] #pwa-boot {
				background: #0b0b0c;
			}
			#pwa-boot .pwa-boot-icon-wrap {
				position: fixed;
				left: var(--boot-icon-cx, 50%);
				top: var(--boot-icon-cy, 50%);
				width: 120px;
				height: 120px;
				margin: 0;
				line-height: 0;
				transform: translate3d(-50%, -50%, 0);
				backface-visibility: hidden;
				/* Hidden until mark PNG is decoded (+ short settle on standalone). */
				opacity: 0;
				transition:
					opacity 0.22s cubic-bezier(0.22, 1, 0.36, 1),
					transform 0.44s cubic-bezier(0.22, 1, 0.36, 1);
			}
			#pwa-boot .pwa-boot-icon-wrap.is-in {
				opacity: 1;
			}
			#pwa-boot .pwa-boot-icon {
				width: 120px;
				height: 120px;
				display: block;
				border-radius: 28px;
				overflow: hidden;
			}
			@media (prefers-reduced-motion: reduce) {
				#pwa-boot {
					transition-duration: 0.12s;
				}
				#pwa-boot .pwa-boot-icon-wrap {
					transition: none;
					opacity: 1;
				}
				#pwa-boot .pwa-boot-pulse-beam {
					display: none;
				}
			}
			#pwa-boot.is-done {
				opacity: 0;
				pointer-events: none;
			}
			#pwa-boot.is-done .pwa-boot-icon-wrap.is-in {
				opacity: 0;
				transform: translate3d(-50%, -50%, 0) scale(0.94);
			}
		</style>
		<script>
			(function () {
				try {
					document.documentElement.setAttribute('data-boot-pending', '');
					var themeKey = 'repdraft.theme';
					var theme = localStorage.getItem(themeKey);
					if (theme !== 'light' && theme !== 'dark') {
						try {
							theme =
								window.matchMedia &&
								window.matchMedia('(prefers-color-scheme: light)').matches
									? 'light'
									: 'dark';
						} catch (themeOsErr) {
							theme = 'dark';
						}
						try {
							localStorage.setItem(themeKey, theme);
						} catch (themeStoreErr) {}
					}
					var bg = theme === 'light' ? '#f2f2f7' : '#0b0b0c';
					/*
					 * HTML boot follows in-app theme (localStorage), same as before.
					 * Native apple-touch-startup-image still follows OS scheme (iOS limit).
					 */
					var isPwaStandalone =
						window.navigator.standalone === true ||
						(window.matchMedia &&
							window.matchMedia('(display-mode: standalone)').matches);
					document.documentElement.setAttribute('data-theme', theme);
					if (theme === 'dark') {
						document.documentElement.classList.add('dark');
					} else {
						document.documentElement.classList.remove('dark');
					}
					document.documentElement.style.setProperty('--boot-bg', bg);
					document.documentElement.style.colorScheme = theme;
					document.documentElement.style.backgroundColor = bg;
					if (isPwaStandalone) {
						document.documentElement.setAttribute('data-pwa-standalone', '');
					}
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute('content', bg);
					/*
					 * Pin boot mark BEFORE body paints — only in standalone PWA.
					 * iPhone PWA: innerHeight starts ~812 then grows to screen.height 874.
					 * Browser / desktop: keep CSS 50%/50% (screen max/min assumes phone portrait
					 * and pushes the mark below the viewport on wide displays).
					 */
					if (isPwaStandalone) {
						try {
							var sh = window.screen && window.screen.height ? window.screen.height : 0;
							var sw = window.screen && window.screen.width ? window.screen.width : 0;
							var bootScreenH = Math.max(sh, sw) || 0;
							var bootScreenW = Math.min(sh, sw) || 0;
							if (bootScreenH > 0) {
								document.documentElement.style.setProperty(
									'--boot-icon-cy',
									bootScreenH / 2 + 'px'
								);
							}
							if (bootScreenW > 0) {
								document.documentElement.style.setProperty(
									'--boot-icon-cx',
									bootScreenW / 2 + 'px'
								);
							}
						} catch (bootPinErr) {}
					}
					try {
						document.cookie =
							themeKey + '=' + theme + '; path=/; Max-Age=31536000; SameSite=Lax';
					} catch (cookieThemeErr) {}
					var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
					if (bar) bar.setAttribute('content', 'black-translucent');
					var localeKey = 'repdraft.locale';
					var storedLocale = localStorage.getItem(localeKey);
					if (storedLocale === 'en' || storedLocale === 'ru') {
						document.documentElement.lang = storedLocale;
						document.documentElement.dataset.locale = storedLocale;
						try {
							document.cookie =
								localeKey + '=' + storedLocale + '; path=/; Max-Age=31536000; SameSite=Lax';
						} catch (localeCookieErr) {}
					}
					/* Auth /auth boot: pick account vs guest skeleton before Svelte hydrates. */
					var authBoot = 'guest';
					var cacheUser = localStorage.getItem('repdraft:local-cache-user');
					if (cacheUser && cacheUser.trim()) {
						authBoot = 'account';
					} else {
						for (var i = 0; i < localStorage.length; i++) {
							var k = localStorage.key(i);
							if (!k || k.indexOf('sb-') !== 0 || k.slice(-11) !== '-auth-token') continue;
							var raw = localStorage.getItem(k);
							if (!raw) continue;
							try {
								var parsed = JSON.parse(raw);
								var uid =
									(parsed && parsed.user && parsed.user.id) ||
									(parsed &&
										parsed.currentSession &&
										parsed.currentSession.user &&
										parsed.currentSession.user.id);
								if (uid) {
									authBoot = 'account';
									break;
								}
							} catch (err) {}
						}
					}
					document.documentElement.dataset.authBoot = authBoot;
					try {
						if (authBoot === 'account') {
							document.cookie =
								'repdraft_auth_boot=1; path=/; Max-Age=31536000; SameSite=Lax';
						} else {
							document.cookie = 'repdraft_auth_boot=; path=/; Max-Age=0; SameSite=Lax';
						}
					} catch (cookieErr) {}
					/* Home boot: start skeleton when local plans exist (or signed-in). */
					var homeBoot = authBoot === 'account' ? 'start' : 'create';
					var workoutsPlanRows = 0;
					try {
						var plansRaw = localStorage.getItem('repdraft:plans');
						if (plansRaw) {
							var plansParsed = JSON.parse(plansRaw);
							if (Array.isArray(plansParsed)) {
								workoutsPlanRows = plansParsed.length;
								if (plansParsed.length > 0) homeBoot = 'start';
							}
						}
					} catch (plansErr) {}
					/* Match WORKOUTS_PLANS_SKELETON_ROW_LIMIT in domain/home.ts */
					var workoutsPlanRowsCapped = Math.min(Math.max(workoutsPlanRows, 0), 6);
					document.documentElement.dataset.workoutsPlanRows = String(
						workoutsPlanRowsCapped
					);
					try {
						document.cookie =
							'repdraft_workouts_plan_rows=' +
							workoutsPlanRowsCapped +
							'; path=/; Max-Age=31536000; SameSite=Lax';
					} catch (workoutsRowsCookieErr) {}
					document.documentElement.dataset.homeBoot = homeBoot;
					try {
						document.cookie =
							'repdraft_home_boot=' +
							homeBoot +
							'; path=/; Max-Age=31536000; SameSite=Lax';
					} catch (homeBootCookieErr) {}
					var homeShowChecklist = true;
					try {
						var onboardingRaw = localStorage.getItem('repdraft:onboarding');
						if (onboardingRaw) {
							var onboardingParsed = JSON.parse(onboardingRaw);
							if (
								onboardingParsed &&
								(onboardingParsed.checklistDismissed === true ||
									onboardingParsed.activatedAt ||
									(onboardingParsed.checklist &&
										onboardingParsed.checklist.sessionFinished === true))
							) {
								homeShowChecklist = false;
							}
						}
					} catch (onboardingErr) {}
					if (homeBoot === 'start') homeShowChecklist = false;
					document.documentElement.dataset.homeShowChecklist = homeShowChecklist
						? '1'
						: '0';
					try {
						if (homeShowChecklist) {
							document.cookie =
								'repdraft_onboarding_checklist=1; path=/; Max-Age=31536000; SameSite=Lax';
						} else {
							document.cookie =
								'repdraft_onboarding_checklist=; path=/; Max-Age=0; SameSite=Lax';
						}
					} catch (onboardingCookieErr) {}
					var homeRecentRows = 0;
					try {
						var sessionsRaw = localStorage.getItem('repdraft:sessions');
						if (sessionsRaw) {
							var sessionsParsed = JSON.parse(sessionsRaw);
							if (Array.isArray(sessionsParsed)) {
								homeRecentRows = sessionsParsed.filter(function (s) {
									return s && s.finishedAt;
								}).length;
							}
						}
					} catch (sessionsErr) {}
					document.documentElement.dataset.homeRecentRows = homeRecentRows > 0 ? '3' : '0';
					/* Match WORKOUTS_HISTORY_SKELETON_ROW_LIMIT in domain/home.ts */
					var workoutsHistoryRowsCapped = Math.min(Math.max(homeRecentRows, 0), 8);
					document.documentElement.dataset.workoutsHistoryRows = String(
						workoutsHistoryRowsCapped
					);
					try {
						if (homeRecentRows > 0) {
							document.cookie =
								'repdraft_home_has_history=1; path=/; Max-Age=31536000; SameSite=Lax';
							document.cookie =
								'repdraft_workouts_history_rows=' +
								workoutsHistoryRowsCapped +
								'; path=/; Max-Age=31536000; SameSite=Lax';
						} else {
							document.cookie = 'repdraft_home_has_history=; path=/; Max-Age=0; SameSite=Lax';
							document.cookie = 'repdraft_workouts_history_rows=0; path=/; Max-Age=31536000; SameSite=Lax';
						}
					} catch (historyCookieErr) {}
					try {
						var activeRaw = localStorage.getItem('repdraft:active-session');
						if (activeRaw) {
							var activeParsed = JSON.parse(activeRaw);
							if (activeParsed && !activeParsed.finishedAt) {
								document.documentElement.dataset.homeActiveSession = '1';
								document.cookie =
									'repdraft_home_active=1; path=/; Max-Age=31536000; SameSite=Lax';
							} else {
								delete document.documentElement.dataset.homeActiveSession;
								document.cookie = 'repdraft_home_active=; path=/; Max-Age=0; SameSite=Lax';
							}
						} else {
							delete document.documentElement.dataset.homeActiveSession;
						}
					} catch (activeErr) {}
					try {
						if (workoutsPlanRows > 0) {
							document.cookie =
								'repdraft_home_has_plans=1; path=/; Max-Age=31536000; SameSite=Lax';
						} else {
							document.cookie = 'repdraft_home_has_plans=; path=/; Max-Age=0; SameSite=Lax';
						}
					} catch (homeCookieErr) {}
					var builderDraftRows = 0;
					try {
						var draftRaw = localStorage.getItem('repdraft:draft');
						if (draftRaw) {
							var draftParsed = JSON.parse(draftRaw);
							if (draftParsed && Array.isArray(draftParsed.exercises)) {
								builderDraftRows = draftParsed.exercises.length;
							}
						}
					} catch (builderDraftErr) {}
					var builderDraftRowsCapped = Math.min(Math.max(builderDraftRows, 0), 4);
					document.documentElement.dataset.builderDraftRows = String(builderDraftRowsCapped);
					try {
						document.cookie =
							'repdraft_builder_draft_rows=' +
							builderDraftRows +
							'; path=/; Max-Age=31536000; SameSite=Lax';
					} catch (builderDraftCookieErr) {}
					var bookmarksCount = 0;
					try {
						var bookmarksRaw = localStorage.getItem('repdraft:bookmarks');
						if (bookmarksRaw) {
							var bookmarksParsed = JSON.parse(bookmarksRaw);
							if (Array.isArray(bookmarksParsed)) {
								bookmarksCount = bookmarksParsed.filter(function (id) {
									return typeof id === 'string' && id.length > 0;
								}).length;
							}
						}
					} catch (bookmarksErr) {}
					try {
						document.cookie =
							'repdraft_bookmarks_count=' +
							bookmarksCount +
							'; path=/; Max-Age=31536000; SameSite=Lax';
					} catch (bookmarksCookieErr) {}
					var recordsCount = 0;
					try {
						var recordsRaw = localStorage.getItem('repdraft:records');
						if (recordsRaw) {
							var recordsParsed = JSON.parse(recordsRaw);
							if (Array.isArray(recordsParsed)) {
								recordsCount = recordsParsed.filter(function (r) {
									if (!r) return false;
									var hasWeight = r.weightKg != null && !isNaN(r.weightKg);
									var hasReps = r.reps != null && !isNaN(r.reps);
									return hasWeight || hasReps;
								}).length;
