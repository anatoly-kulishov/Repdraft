<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content, maximum-scale=5"
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="preload"
			as="style"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			onload="this.onload=null;this.rel='stylesheet'"
		/>
		<noscript>
			<link
				rel="stylesheet"
				href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			/>
		</noscript>
		<meta name="theme-color" content="#FCFCFC" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Repdraft" />
		<meta name="application-name" content="Repdraft" />
		<meta name="format-detection" content="telephone=no" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-v2.png" sizes="180x180" />
		<link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed-v2.png" sizes="180x180" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" href="/icon-192-v2.png" type="image/png" sizes="192x192" />
		<style>
			html,
			body {
				margin: 0;
				min-height: 100%;
				background-color: #fcfcfc;
			}
			html[data-theme='dark'],
			html[data-theme='dark'] body {
				background-color: #0f1012;
			}
			#pwa-boot {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: grid;
				place-items: center;
				background: #fcfcfc;
				pointer-events: none;
				transition: opacity 0.2s ease;
			}
			html[data-theme='dark'] #pwa-boot {
				background: #0f1012;
			}
			#pwa-boot .pwa-boot-icon-wrap {
				width: 96px;
				height: 96px;
				line-height: 0;
			}
			#pwa-boot .pwa-boot-icon {
				width: 96px;
				height: 96px;
				display: block;
			}
			#pwa-boot.is-done {
				opacity: 0;
			}
		</style>
		<script>
			(function () {
				try {
					var themeKey = 'repdraft.theme';
					var theme = localStorage.getItem(themeKey);
					if (theme !== 'light' && theme !== 'dark') {
						theme = 'light';
					}
					var bg = theme === 'light' ? '#fcfcfc' : '#0f1012';
					document.documentElement.setAttribute('data-theme', theme);
					if (theme === 'dark') {
						document.documentElement.classList.add('dark');
					} else {
						document.documentElement.classList.remove('dark');
					}
					document.documentElement.style.colorScheme = theme;
					document.documentElement.style.backgroundColor = bg;
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute('content', bg);
					var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
					if (bar) bar.setAttribute('content', 'black-translucent');
					var localeKey = 'repdraft.locale';
					var storedLocale = localStorage.getItem(localeKey);
					if (storedLocale === 'en' || storedLocale === 'ru') {
						document.documentElement.lang = storedLocale;
						document.documentElement.dataset.locale = storedLocale;
					}
					/* Auth /auth boot: pick account vs guest skeleton before Svelte hydrates. */
					var authBoot = 'guest';
					var cacheUser = localStorage.getItem('repdraft:local-cache-user');
					if (cacheUser && cacheUser.trim()) {
						authBoot = 'account';
					} else {
						for (var i = 0; i < localStorage.length; i++) {
							var k = localStorage.key(i);
							if (!k || k.indexOf('sb-') !== 0 || k.slice(-11) !== '-auth-token') continue;
							var raw = localStorage.getItem(k);
							if (!raw) continue;
							try {
								var parsed = JSON.parse(raw);
								var uid =
									(parsed && parsed.user && parsed.user.id) ||
									(parsed &&
										parsed.currentSession &&
										parsed.currentSession.user &&
										parsed.currentSession.user.id);
								if (uid) {
									authBoot = 'account';
									break;
								}
							} catch (err) {}
						}
					}
					document.documentElement.dataset.authBoot = authBoot;
					try {
						if (authBoot === 'account') {
							document.cookie =
								'repdraft_auth_boot=1; path=/; Max-Age=31536000; SameSite=Lax';
						} else {
							document.cookie = 'repdraft_auth_boot=; path=/; Max-Age=0; SameSite=Lax';
						}
					} catch (cookieErr) {}
					/* Home boot: start skeleton when local plans exist (or signed-in). */
					var homeBoot = authBoot === 'account' ? 'start' : 'create';
					try {
						var plansRaw = localStorage.getItem('repdraft:plans');
						if (plansRaw) {
							var plansParsed = JSON.parse(plansRaw);
							if (Array.isArray(plansParsed) && plansParsed.length > 0) homeBoot = 'start';
						}
					} catch (plansErr) {}
					document.documentElement.dataset.homeBoot = homeBoot;
					try {
						if (homeBoot === 'start') {
							document.cookie =
								'repdraft_home_has_plans=1; path=/; Max-Age=31536000; SameSite=Lax';
						} else {
							document.cookie = 'repdraft_home_has_plans=; path=/; Max-Age=0; SameSite=Lax';
						}
					} catch (homeCookieErr) {}
				} catch (e) {}
			})();
			// Capture beforeinstallprompt early — it can fire before Svelte mounts.
			(function () {
				window.__repdraftBip = null;
				window.addEventListener('beforeinstallprompt', function (e) {
					e.preventDefault();
					window.__repdraftBip = e;
					window.dispatchEvent(new CustomEvent('repdraft:bip'));
				});
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="pwa-boot" aria-hidden="true">
			<div class="pwa-boot-icon-wrap">
				<svg
					class="pwa-boot-icon"
					viewBox="0 0 512 512"
					width="96"
					height="96"
					aria-hidden="true"
					focusable="false"
				>
					<defs>
						<linearGradient id="repdraft-boot-g" x1="0" y1="0" x2="1" y2="1">
							<stop offset="0%" stop-color="#C8FF00" />
							<stop offset="62%" stop-color="#A8FF00" />
							<stop offset="100%" stop-color="#00FF94" />
						</linearGradient>
					</defs>
					<rect width="512" height="512" rx="114" fill="url(#repdraft-boot-g)" />
					<path d="M 0.00 340.00 L 66.00 340.00 L 75.00 335.00 L 81.00 327.00 L 144.00 211.00 L 146.00 209.00 L 149.00 209.00 L 234.00 330.00 L 238.00 334.00 L 247.00 339.00 L 265.00 340.00 L 269.00 342.00 L 269.00 345.00 L 231.00 431.00 L 231.00 437.00 L 294.00 437.00 L 305.00 426.00 L 374.00 267.00 L 379.00 263.00 L 468.00 263.00 L 475.00 262.00 L 489.00 258.00 L 502.00 252.00 L 518.00 241.00 L 530.00 229.00 L 540.00 215.00 L 548.00 199.00 L 552.00 187.00 L 553.00 179.00 L 555.00 178.00 L 555.00 140.00 L 553.00 139.00 L 549.00 123.00 L 539.00 105.00 L 522.00 87.00 L 510.00 79.00 L 491.00 71.00 L 474.00 68.00 L 370.00 68.00 L 369.00 72.00 L 372.00 84.00 L 372.00 111.00 L 368.00 127.00 L 369.00 132.00 L 464.00 132.00 L 476.00 138.00 L 482.00 144.00 L 486.00 151.00 L 488.00 158.00 L 488.00 169.00 L 486.00 176.00 L 476.00 190.00 L 461.00 198.00 L 455.00 199.00 L 349.00 199.00 L 337.00 203.00 L 331.00 207.00 L 323.00 216.00 L 294.00 284.00 L 290.00 290.00 L 287.00 290.00 L 222.00 203.00 L 221.00 198.00 L 223.00 196.00 L 276.00 195.00 L 295.00 189.00 L 317.00 175.00 L 334.00 156.00 L 344.00 139.00 L 351.00 120.00 L 354.00 102.00 L 354.00 87.00 L 352.00 72.00 L 347.00 56.00 L 340.00 42.00 L 333.00 32.00 L 320.00 19.00 L 310.00 12.00 L 298.00 6.00 L 285.00 2.00 L 281.00 2.00 L 280.00 0.00 L 33.00 0.00 L 33.00 3.00 L 73.00 56.00 L 80.00 63.00 L 84.00 65.00 L 93.00 67.00 L 101.00 66.00 L 104.00 67.00 L 265.00 67.00 L 276.00 72.00 L 282.00 78.00 L 287.00 87.00 L 289.00 98.00 L 288.00 105.00 L 283.00 116.00 L 274.00 125.00 L 262.00 130.00 L 131.00 130.00 L 122.00 132.00 L 111.00 138.00 L 103.00 147.00 L 93.00 167.00 L 87.00 176.00 L 2.00 334.00 L 0.00 335.00 Z" fill="#0F1012" fill-rule="evenodd" transform="translate(76.000 112.201) scale(0.647482)" />
				</svg>
			</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			(function () {
				var boot = document.getElementById('pwa-boot');
				if (!boot) return;
				var done = false;
				var hide = function () {
					if (done) return;
					done = true;
					boot.classList.add('is-done');
					window.setTimeout(function () {
						if (boot && boot.parentNode) boot.remove();
					}, 220);
				};
				/* Do not wait for window.load — font/preload hangs leave splash forever. */
				if (document.readyState === 'interactive' || document.readyState === 'complete') {
					hide();
				} else {
					document.addEventListener('DOMContentLoaded', hide, { once: true });
				}
				window.addEventListener('load', hide, { once: true });
				window.setTimeout(hide, 1200);
			})();
		</script>
	</body>
</html>
