<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
		/>
		<meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0f766e" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Repdraft" />
		<meta name="application-name" content="Repdraft" />
		<meta name="format-detection" content="telephone=no" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<style>
			/* First paint before Svelte hydrate — matches --color-bg / PWA splash. */
			html,
			body {
				margin: 0;
				min-height: 100%;
				background: #e8ecf0;
			}
			#pwa-boot {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: grid;
				place-items: center;
				background: #e8ecf0;
				pointer-events: none;
				transition: opacity 0.2s ease;
			}
			#pwa-boot img {
				width: 96px;
				height: 96px;
				border-radius: 22%;
			}
			#pwa-boot.is-done {
				opacity: 0;
			}
		</style>
		<!-- Apply saved locale before first paint to avoid RU→EN text flash. -->
		<script>
			(function () {
				try {
					var key = 'repdraft.locale';
					var stored = localStorage.getItem(key);
					if (stored === 'en' || stored === 'ru') {
						document.documentElement.lang = stored;
						document.documentElement.dataset.locale = stored;
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="pwa-boot" aria-hidden="true">
			<img src="/icon.svg" alt="" width="96" height="96" />
		</div>
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			(function () {
				var boot = document.getElementById('pwa-boot');
				if (!boot) return;
				var hide = function () {
					boot.classList.add('is-done');
					window.setTimeout(function () {
						boot.remove();
					}, 220);
				};
				if (document.readyState === 'complete') hide();
				else window.addEventListener('load', hide, { once: true });
			})();
		</script>
	</body>
</html>
